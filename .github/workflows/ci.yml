name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

  audits:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build (for Lighthouse)
        run: npm run build
      - name: Run Lighthouse CI (strict)
        run: npx lhci autorun --config=.lighthouserc.json
      - name: Accessibility (axe) quick scan
        run: |
          npm run preview &
          for i in {1..30}; do
            curl -sSf http://localhost:4173 >/dev/null && echo "Server up" && break || sleep 1;
          done
          node scripts/axe-check.mjs
